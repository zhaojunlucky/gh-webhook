name: webhook_receiver_api
type: suite
enabled: true # default is true
environment:
  API_PREFIX: http://localhost:8080/api
global: # dynamic
  headers:
    Content-Type: application/json
  dataDir: ./data
  apiPrefix: ${env.API_PREFIX}
cases:
  - desc: list webhook receivers
    enabled: true # default is true
    name: list
    request:
      url: gh-webhook-receiver # dynamic
      method: GET # default is get
    response:
      code: 200 #
      contentType: application/json
      body:
        type: JSON
        array: false # json array or not, default is false
        length: 0 # json array length
  - desc: create github webhook receiver
    enabled: true
    name: create
    request:
      url: gh-webhook-receiver
      method: POST
      headers:
        "Content-Type": application/json
      body: >
        {"name": "receiver1", "githubId":1, "receiverConfig": {"type": "http", "url": "http://localhost:8000", "auth": "none"}}
    response:
      code: 201
      contentType: application/json
      body:
        type: JSON
        array: false
        validators:
          and:
            - $.id: 1
  - desc: get github webhook receiver
    request:
     url: github/${ctx.create.resp.id}
     method: GET
    response:
     code: 200
     contentType: application/json
     body:
       array: false
       validators:
         and:
           - $.id: ${ctx.create.resp.id}

  - desc: create duplicate github webhook receiver
    enabled: true
    request:
      url: gh-webhook-receiver
      method: POST
      headers:
        "Content-Type": application/json
      body: >
        {"name": "receiver1", "githubId":1, "receiverConfig": {"type": "http", "url": "http://localhost:8000", "auth": "none"}}
    response:
      code: 422
      contentType: application/json

  - desc: create 2nd github webhook receiver
    name: create2
    enabled: true
    request:
      url: gh-webhook-receiver
      method: POST
      headers:
        "Content-Type": application/json
      body: >
        {"name": "receiver2", "githubId":1, "receiverConfig": {"type": "http", "url": "http://localhost:8000", "auth": "none"}}
    response:
      code: 201
      contentType: application/json
      body:
        type: JSON
        array: false
        validators:
          and:
            - $.id: 2
  - desc: list github webhook receiver
    requestRef: list
    response:
      code: 200
      contentType: application/json
      body:
        array: false
        validators:
          and:
            - $.entryCount: 2
            - $.entries[0].id: ${ctx.create.resp.id}
            - $.entries[1].id: ${ctx.create2.resp.id}
            - or:
                - $.entries[0].name: 'receiver1'
                - $.entries[1].name: 'receiver2'
  - desc: delete github webhook receiver
    request:
      url: gh-webhook-receiver/${ctx.create2.resp.id}
      method: DELETE
    response:
      code: 204
  - desc: list github webhook receiver
    requestRef: list
    response:
      code: 200
      contentType: application/json
      body:
        array: false
        validators:
          and:
            - $.entryCount: 1
#            - $.entries.length: 1
            - $.entries[0].id: ${ctx.create.resp.id}
        script: if (body.entries[0].name != 'receiver1') {
          throw new Error("invalid name")
          }
  - desc: get github webhook receiver
    request:
      url: gh-webhook-receiver/${ctx.create2.resp.id}
      method: GET
    response:
      code: 404
  
