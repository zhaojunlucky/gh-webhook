      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: web hook receiver id
        - in: path
          name: cId
          type: integer
          required: true
          description: subscribe id
        - in: body
          name: webhookReceiver
          description: The webhook receiver to update.
          schema:
            type: object
            properties:
              event:
                type: string
                description: subscribe event
              filters:
                $ref: "#/definitions/ghWebhookSubscribeCreateFilter"
      responses:
        200:
          description: Updated
          schema:
            $ref: "#/definitions/updated"
        default:
          description: unexpected error
          schema:
            $ref: "#/definitions/errors"
    delete:
      summary: unsubscribe a webhook receiver
      description: unsubscribe a webhook receiver
      tags:
